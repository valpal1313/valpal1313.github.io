<!DOCTYPE html>
<html>
    <head>
        <title>Tax Calculator</title>
        <script>
            function CalculateTax()
            {
                var purchase = document.getElementById("purchase").value;
                var tax = purchase * 0.0825;
                var total = Number(purchase) + tax;
                document.getElementById("tax").value = tax.toFixed(2);
                document.getElementById("total").value = total.toFixed(2);
            }
        </script>
    </head>
    <body>
        <h1>Purchase Tax Calculator</h1>
        <label for="purchase">Purchase Amount</label>
        <input type="text" id="purchase">

        <br><br>

        <label for="tax">Tax Amount:</label>
        <input type="text" id="tax">

        <br><br>

        <lable for="total">Total</lable>
        <input type="text" id="total"disabled>

        <input type="button" value="Click Here to CalculateTax" onclick="CalculateTax()">

    </body>
</html>
